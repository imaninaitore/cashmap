<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<style>

/*variables*/
:root{
    --main-color: rgba(5, 115, 129, 0.539);  
    --heading-font: Georgia, serif;
}

/*styling using variables*/
.theme{
    background-color: var(--main-color);
}
 
.hfont{
    font-family: var(--heading-font);
}

</style>

<body class="flex justify-center items-center min-h-screen theme bg-gradient-to-r from-slate-900 via-cyan-500 to-slate-900 px-6 py-6 m-4 ">
 
<div class="bg-cyan-950 w-full max-w-sm p-6 rounded-xl shadow-lg ">

<header class=" p-3 bg-gradient-to-r from-slate-900 via-cyan-500 to-slate-900 rounded-t-xl">
<h1 class="theme hfont text-center font-bold text-xl text-cyan-50">Registration form</h1>
</header>

<div class="form-container bg-slate-900 p-4 rounded-b-xl">

<form action="/submit-form">

<div class="p-4">
<label class="text-white" for="fname">Full Name</label><br>
<input class=" w-full py-2 px-3 mb-4 rounded bg-white hover:bg-sky-100 focus:outline-2 focus:outline-offset-2 focus:outline-cyan-500 active:bg-indigo-100 " type="text" id="fname" name="Full Name" placeholder="Enter your full name" required><br>    
</div>

<div class="p-4">
<label class="text-white" for="fname">Email Address</label><br>
<input class=" w-full py-2 px-3 mb-4 rounded bg-white hover:bg-sky-100 focus:outline-2 focus:outline-offset-2 focus:outline-cyan-500 active:bg-indigo-100 " type="email" id="email" name="email" placeholder="@gmail.com" required><br>
</div>

<div class="p-4">
<label class="text-white" for="fname">username</label><br>
<input class="w-full py-2 px-3 mb-4 rounded bg-white hover:bg-sky-100 focus:outline-2 focus:outline-offset-2 focus:outline-cyan-500 active:bg-indigo-100" type="text" id="name" name="username" placeholder="Enter your preferred username" required><br>
</div>

<div class="p-4">
<label class="text-white" for="pic">Profile picture</label><br>
<input class="w-full py-2 px-3 mb-4 rounded bg-white hover:bg-sky-100 focus:outline-2 focus:outline-offset-2 focus:outline-cyan-500 active:bg-indigo-100 " type="file" id="picture" name="picture" placeholder="profile picture" required accept="image/"><br>
</div>

<div class="p-4">
<label class="text-white" for="Password">Create Password</label><br>
<input class="w-full py-2 px-3 mb-4 rounded bg-white hover:bg-sky-100 focus:outline-2 focus:outline-offset-2 focus:outline-cyan-500 active:bg-indigo-100 " type="password" id="Password" name="Password" placeholder="create Password" required><br>
</div>

<div class="p-4">
<label class="text-white" for="cpwd">confirm password</label><br>
<input class="w-full py-2 px-3 mb-4 rounded bg-white hover:bg-sky-100 focus:outline-2 focus:outline-offset-2 focus:outline-cyan-500 active:bg-indigo-100 " type="password" id="cpwd" name="confirm password" placeholder="confirm password" required><br>
</div>

<div class="p-4">
<label class="text-white" for="dob">Date of birth</label><br>
<input class="w-full py-2 px-3 mb-4 rounded bg-white hover:bg-sky-100 focus:outline-2 focus:outline-offset-2 focus:outline-cyan-500 active:bg-indigo-100" type="date" id="dob" name="Date of birth" placeholder="date of birth" required><br>
</div>

<div class="p-4 ">
<label class="text-white" for="no.">Phone Number</label><br>
<input class="w-full py-2 px-3 mb-4 rounded bg-white hover:bg-sky-100 focus:outline-2 focus:outline-offset-2 focus:outline-cyan-500 active:bg-indigo-100 " type="number" id="no." name="phone number" placeholder="phone number" required><br>
</div>

 <p class="text-white text-lg">What country are you from ?</p>
    <select name="country" id="nationality">
        <option class="text-cyan-300 " value="kenya">Kenya</option>
        <option class="text-cyan-300 text-lg" value="Tanzania">Tanzanina</option>
        <option class="text-cyan-300  text-lg" value="uganda">Uganda</option>

    </select>

 <p class="text-white text-lg ">Gender</p>
    <input type="radio" id="male" name="gender">
    <label class="text-white" for="male">Male</label>

    <input type="radio" id="female" name="gender">
    <label class="text-white" for="female">Female</label>

    
 <p class="text-white text-lg ">Preferred account type ? </p>
    <input type="radio" id="personal" name="account">
    <label class="text-white" for="personal">Personal</label>

    <input type="radio" id="business" name="account">
    <label class="text-white" for="business">business</label>

    <div class="p-4">
    <p class="text-white text-lg">How did you hear about us ?</p>
     <input type="checkbox" id="media" name="feedback">
    <label class="text-white" for="gaming">social media</label>

    <input type="checkbox" id="internet" name="feedback">
    <label class="text-white" for="female">internet research</label>

    <input type="checkbox" id="friends" name="feedback">
    <label class="text-white" for="friends">friends</label>
    </div>

   <button class="w-full py-3 px-3 mb-4 rounded bg-indigo-600 p-4 hover:scale-105 transition-all duration-300 focus:bg-indigo-400 focus:outline-2 focus:outline-offset-2 focus:outline-indigo-500 active:bg-indigo-400 ">
    SIGN IN 
</button>

</form>
</div>

</div>    
</body>
</html>
